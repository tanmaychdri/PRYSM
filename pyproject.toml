[project]
name = "prysm"
version = "0.1.0"
description = "A modular, async-first personal AI assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    "faster-whisper>=1.0.0",
    "elevenlabs>=1.4.0",
    "setuptools",
    "openai>=3.6.0",
]

[project.scripts]
prysm = "prysm.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prysm"]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.5",
    "pyright>=1.1.381",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = []

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
