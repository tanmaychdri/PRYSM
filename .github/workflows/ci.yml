name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v3
    - name: Setup Python
      run: uv python install 3.12
    - name: Install dependencies
      run: uv sync
    - name: Run Pytest
      run: uv run pytest
    - name: Run Ruff
      run: uv run ruff check .
